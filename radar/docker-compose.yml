services:
  radar:
    build: .
    container_name: radar
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Europe/Rome
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('https://dns.google', timeout=5)"]
      interval: 10m
      timeout: 10s
      retries: 3
